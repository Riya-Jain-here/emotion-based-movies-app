<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Results</title>
</head>
<body>
  <a href="{% url 'home' %}">← Back</a>

  {% if error %}
    <p style="color: red">{{ error }}</p>
  {% else %}
    <h2>Input</h2>
    <p>{{ text }}</p>

    <h3>Predicted emotion: {{ predicted_emotion }}</h3>
    {% if confidence %}
      <p>Confidence: {{ confidence|floatformat:2 }}</p>
    {% endif %}

    <h3>Recommended movies</h3>
    <ul>
      {% for m in movies %}
        <li>{{ m }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</body>
</html>
